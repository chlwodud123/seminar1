<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Canvas Studio — 그림판 웹 앱</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e8eaee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas_studio_canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        #loading_overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #f4f5f7;
            color: #334155;
            z-index: 10;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #cbd5e1;
            border-top-color: #3584e4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading_overlay">
        <div class="spinner"></div>
        <div style="font-size: 15px; font-weight: 600;">Canvas Studio 불러오는 중...</div>
        <div style="font-size: 12px; color: #64748b;">Rust + WebAssembly 그림판 앱을 초기화하고 있습니다.</div>
    </div>
    <canvas id="canvas_studio_canvas"></canvas>
    <script type="module">
        import init from './pkg/canvas_studio.js';
        init().catch((err) => {
            const overlay = document.getElementById('loading_overlay');
            if (overlay) {
                overlay.innerHTML = `<div style="color:#dc2626;font-weight:600;">Canvas Studio 실행 오류</div><pre style="font-size:12px;color:#475569;max-width:90%;overflow:auto;">${err}</pre>`;
            }
        });
    </script>
</body>
</html>
