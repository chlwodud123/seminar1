<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beach Blob Volley — 블로비 배구 웹 게임</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0e1626;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #blobby_canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        #loading_overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #0e1626;
            color: #e2e8f0;
            z-index: 10;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading_overlay">
        <div class="spinner"></div>
        <div style="font-size: 15px; font-weight: 600;">Beach Blob Volley 불러오는 중...</div>
        <div style="font-size: 12px; color: #94a3b8;">Rust + WebAssembly 비치 배구 게임을 초기화하고 있습니다.</div>
    </div>
    <canvas id="blobby_canvas"></canvas>
    <script type="module">
        import init from './pkg/beach_blob_volley.js';
        init().catch((err) => {
            const overlay = document.getElementById('loading_overlay');
            if (overlay) {
                overlay.innerHTML = `<div style="color:#f87171;font-weight:600;">Beach Blob Volley 실행 오류</div><pre style="font-size:12px;color:#cbd5e1;max-width:90%;overflow:auto;">${err}</pre>`;
            }
        });
    </script>
</body>
</html>
